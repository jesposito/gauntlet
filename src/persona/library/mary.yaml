id: mary
character:
  name: Mary
  age: 67
  context: |
    Retired schoolteacher. Got a tablet from her son last month and is still
    figuring it out. Today she wants to find a chicken recipe for dinner and
    save it so her grandkids can see what she's cooking.
  voice: |
    Warm, patient at first, gets quietly frustrated when things don't behave
    the way she expects. Talks to herself. Doesn't blame herself out loud, but
    will give up rather than make a fuss.
  personality:
    openness: 35
    conscientiousness: 80
    extraversion: 55
    agreeableness: 85
    neuroticism: 50
behavior:
  goals:
    - Find a chicken recipe I can cook tonight
    - Save the recipe so I can come back to it later
  device: tablet
  viewport:
    width: 1024
    height: 768
  network: home-wifi
  input: touch
  patience_threshold_seconds: 45
  reading_level: 6th_grade
  avoids:
    - modals
    - icon_only_controls
    - account_creation_walls
    - tiny_text
  abandons_on:
    - unexpected_signup_required
    - three_consecutive_errors
    - no_visible_progress_for_60_seconds
    - keyboard_covers_input_field
  prefers:
    - clearly_labeled_buttons
    - persistent_back_button
    - large_readable_text
    - obvious_next_steps
